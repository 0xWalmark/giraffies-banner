<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giraffies Banner Maker</title>
<style>
body{margin:0;background:#1a0a2e;color:white;font-family:sans-serif;text-align:center}
canvas{width:100%;max-width:1000px;margin-top:20px;border-radius:12px}
button{margin:10px;padding:10px 20px;border-radius:20px;border:none;cursor:pointer}
</style>
</head>
<body>
<h1>Banner Maker</h1>
<button onclick="generate()">Generate</button>
<canvas id="cv" width="1500" height="500"></canvas>

<script>
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');

// background
const bg = new Image();
bg.src = 'https://i.imgur.com/8bKQ8KX.png';

// clouds
const clouds = new Image();
clouds.src = 'https://i.imgur.com/V4RclNb.png';

// mask (TESTA GIRAFFA - devi sostituire con tua)
const mask = new Image();
mask.src = 'https://i.imgur.com/3W5QZ6H.png';

// giraffe test
const giraffe = new Image();
giraffe.crossOrigin = "anonymous";
giraffe.src = 'https://picsum.photos/400/600';

function drawClouds(){
  const centerY = canvas.height/2;
  const y = centerY + 20; // FIX posizione corretta
  ctx.drawImage(clouds,0,y,canvas.width,200);
}

function drawGiraffe(x){
  const w = 220;
  const h = 320;
  const y = canvas.height/2 - h/2 + 40;

  // disegna giraffa
  ctx.drawImage(giraffe,x,y,w,h);

  // applica mask testa
  ctx.globalCompositeOperation = "destination-in";
  ctx.drawImage(mask,x,y,w,h);
  ctx.globalCompositeOperation = "source-over";
}

function generate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // sfondo
  ctx.drawImage(bg,0,0,canvas.width,canvas.height);

  // giraffe (dietro)
  drawGiraffe(200);
  drawGiraffe(500);
  drawGiraffe(800);

  // nuvole sopra (depth effect 🔥)
  drawClouds();
}
</script>
</body>
</html>
