<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giraffies Club Banner Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { background:linear-gradient(135deg,#1a0a2e,#2d1060,#1a0a2e); min-height:100vh; font-family:Nunito,sans-serif; color:white; padding:20px; }
h1 { font-family:"Fredoka One",cursive; font-size:2.2rem; text-align:center; color:#f9c74f; text-shadow:2px 2px 0 #4a1d8c; margin-bottom:4px; }
.sub { text-align:center; color:#c9a0dc; font-size:.85rem; margin-bottom:20px; letter-spacing:3px; text-transform:uppercase; }
.panel { background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); border-radius:16px; padding:20px; margin:0 auto 16px; max-width:820px; }
.panel h2 { font-family:"Fredoka One",cursive; color:#f9c74f; font-size:1.1rem; margin-bottom:14px; }
.row { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
input[type=number] { width:130px; padding:9px 12px; border-radius:10px; border:2px solid rgba(249,199,79,.3); background:rgba(0,0,0,.4); color:white; font-family:Nunito,sans-serif; font-weight:700; font-size:.95rem; text-align:center; outline:none; }
input:focus { border-color:#f9c74f; }
.lbl { font-size:.7rem; color:#c9a0dc; font-weight:700; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
.btn { padding:10px 22px; border-radius:50px; border:none; cursor:pointer; font-family:"Fredoka One",cursive; font-size:1rem; transition:all .2s; }
.by { background:#f9c74f; color:#1a0a2e; }
.bp { background:linear-gradient(135deg,#7c3aed,#4a1d8c); color:white; }
.bg2 { background:linear-gradient(135deg,#10b981,#059669); color:white; }
.btn:hover { transform:translateY(-2px); }
.btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
.tags { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.tag { background:rgba(249,199,79,.15); border:1px solid rgba(249,199,79,.4); border-radius:20px; padding:4px 12px; font-size:.82rem; font-weight:700; color:#f9c74f; display:flex; align-items:center; gap:6px; }
.tag button { background:none; border:none; color:#e8637a; cursor:pointer; font-size:1rem; }
.wrap { max-width:820px; margin:0 auto 16px; border-radius:12px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.6); border:2px solid rgba(255,255,255,.1); }
.wrap canvas { width:100%; height:auto; display:block; }
.log { max-width:820px; margin:0 auto 14px; background:rgba(0,0,0,.5); border-radius:8px; padding:10px 14px; font-size:.75rem; font-family:monospace; max-height:150px; overflow-y:auto; border:1px solid rgba(255,255,255,.1); }
.ok { color:#4ade80; } .er { color:#f87171; } .in { color:#c9a0dc; } .wn { color:#fbbf24; }
.acts { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; max-width:820px; margin:0 auto 30px; }
.note { font-size:.73rem; color:#9070b0; margin-top:10px; }
</style>
</head>
<body>
<h1>GIRAFFIES CLUB</h1>
<p class="sub">Banner Maker - Above The Clouds</p>

<div class="panel">
  <h2>Inserisci Token ID (1 - 3333)</h2>
  <div class="row">
    <div>
      <div class="lbl">Token ID</div>
      <input type="number" id="tok" placeholder="es. 42" min="1" max="3333">
    </div>
    <button class="btn by" onclick="addG()">+ Aggiungi</button>
  </div>
  <div class="tags" id="queue"></div>
  <p class="note">Fino a 5 giraffe per banner</p>
</div>

<div class="log" id="log"><span class="in">Pronto.</span></div>

<div class="wrap">
  <canvas id="cv" width="1500" height="500"></canvas>
</div>

<div class="acts">
  <button class="btn bp" id="btnG" onclick="generate()">Genera Banner</button>
  <button class="btn bg2" onclick="dl()">Scarica PNG</button>
</div>

function addLog(msg, cls) {
  var box = document.getElementById("log");
  var d = document.createElement("div");
  d.className = cls || "in";
  d.textContent = msg;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function loadImg(src) {
  return new Promise(function(res, rej) {
    var img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = function() { res(img); };
    img.onerror = function() { rej(new Error("Load failed: " + src.slice(0,80))); };
    img.src = src;
  });
}

function loadImgNoCors(src) {
  return new Promise(function(res, rej) {
    var img = new Image();
    img.onload = function() { res(img); };
    img.onerror = function() { rej(new Error("Load failed: " + src.slice(0,80))); };
    img.src = src;
  });
}

function removeBg(img) {
  var c = document.createElement("canvas");
  c.width = img.naturalWidth;
  c.height = img.naturalHeight;
  var ctx = c.getContext("2d");
  ctx.drawImage(img, 0, 0);
  try {
    var id = ctx.getImageData(0, 0, c.width, c.height);
    var d = id.data;
    var bgR = d[0], bgG = d[1], bgB = d[2];
    var T = 38;
    for (var i = 0; i < d.length; i += 4) {
      if (Math.abs(d[i]-bgR)<T && Math.abs(d[i+1]-bgG)<T && Math.abs(d[i+2]-bgB)<T) {
        d[i+3] = 0;
      }
    }
    ctx.putImageData(id, 0, 0);
  } catch(e) { addLog("removeBg skip: " + e.message, "wn"); }
  return c;
}

function drawGiraffe(ctx, nftC, neckImg, slotX, slotW) {
  var W = nftC.width, H = nftC.height;
  var rW = Math.floor(slotW * 0.78);
  var offX = slotX + (slotW - rW) / 2;
  var scale = rW / W;
  var splitY = Math.floor(H * 0.52);
  var cloudY = 255;
  var extraNeck = 85;
  ctx.drawImage(nftC, 0, splitY, W, H-splitY, offX, cloudY+15, rW, Math.floor((H-splitY)*scale));
  var nW = Math.floor(rW * 0.27);
  var nX = offX + (rW - nW) / 2;
  ctx.drawImage(neckImg, nX, cloudY - extraNeck + 5, nW, extraNeck + 10);
  var hH = Math.floor(splitY * scale);
  ctx.drawImage(nftC, 0, 0, W, splitY, offX, cloudY - extraNeck - hH + 15, rW, hH);
}

  var inp = document.getElementById("tok");
  var id = parseInt(inp.value);
  if (!id || id < 1 || id > 3333) { addLog("Token ID non valido (1-3333)", "er"); return; }
  if (giraffes.length >= 5) { addLog("Max 5 giraffe!", "wn"); return; }
  var dup = false;
  for (var i = 0; i < giraffes.length; i++) { if (giraffes[i].id === id) dup = true; }
  if (dup) { addLog("#" + id + " gia aggiunto", "wn"); return; }
  giraffes.push({ id: id });
  inp.value = "";
  renderTags();
  addLog("Aggiunta giraffa #" + id, "ok");
}

function removeG(id) {
  var ng = [];
  for (var i = 0; i < giraffes.length; i++) { if (giraffes[i].id !== id) ng.push(giraffes[i]); }
  giraffes = ng;
  renderTags();
}

function renderTags() {
  var html = "";
  for (var i = 0; i < giraffes.length; i++) {
    var id = giraffes[i].id;
    html += "<div class=\"tag\">Giraffa #" + id + " <button onclick=\"removeG(" + id + ")\">x</button></div>";
  }
  document.getElementById("queue").innerHTML = html;
}

function generate() {
  if (busy) return;
  if (!giraffes.length) { addLog("Aggiungi almeno un Token ID", "wn"); return; }
  busy = true;
  document.getElementById("btnG").disabled = true;
  var canvas = document.getElementById("cv");
  var ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, 1500, 500);

  Promise.all([loadImg(BG), loadImg(CL), loadImg(NK)])
    .then(function(assets) {
      var bgI = assets[0], cloudsI = assets[1], neckI = assets[2];
      ctx.drawImage(bgI, 0, 0, 1500, 500);
      addLog("Sfondo OK", "ok");
      var slotW = Math.floor(1500 / giraffes.length);
      var idx = 0;

      function nextGiraffe() {
        if (idx >= giraffes.length) {
          ctx.drawImage(cloudsI, 0, 500 - Math.floor(500*0.44), 1500, Math.floor(500*0.44));
          addLog("Banner completato!", "ok");
          busy = false;
          document.getElementById("btnG").disabled = false;
          return;
        }
        var g = giraffes[idx];
        var slotX = idx * slotW;
        idx++;
        var url = BASE + g.id;
        addLog("Caricamento #" + g.id + ": " + url, "in");
        loadImgNoCors(url)
          .then(function(img) {
            addLog("#" + g.id + " OK " + img.naturalWidth + "x" + img.naturalHeight, "ok");
            var noBg = document.createElement("canvas"); noBg.width = img.naturalWidth; noBg.height = img.naturalHeight; noBg.getContext("2d").drawImage(img,0,0);
            drawGiraffe(ctx, noBg, neckI, slotX, slotW);
            addLog("#" + g.id + " disegnata!", "ok");
            nextGiraffe();
          })
          .catch(function(e) {
            addLog("#" + g.id + " ERRORE: " + e.message, "er");
            nextGiraffe();
          });
      }
      nextGiraffe();
    })
    .catch(function(e) {
      addLog("ERRORE: " + e.message, "er");
      busy = false;
      document.getElementById("btnG").disabled = false;
    });
}

function dl() {
  var a = document.createElement("a");
  a.download = "giraffies-banner.png";
  a.href = document.getElementById("cv").toDataURL("image/png");
  a.click();
}

window.onload = function() {
  Promise.all([loadImg(BG), loadImg(CL)]).then(function(imgs) {
    var ctx = document.getElementById("cv").getContext("2d");
    ctx.drawImage(imgs[0], 0, 0, 1500, 500);
    ctx.drawImage(imgs[1], 0, 500 - Math.floor(500*0.44), 1500, Math.floor(500*0.44));
    addLog("App pronta! Inserisci Token ID e genera.", "ok");
  });
};

document.addEventListener("DOMContentLoaded", function() {
  document.getElementById("tok").addEventListener("keydown", function(e) {
    if (e.key === "Enter") addG();
  });
});
</script>
</body>
</html>
